;==========================================================
;
;   POLYBAR CONFIG - Merged aesthetic
;   Based on reedrw's aesthetic with custom modules
;
;==========================================================

[colors]
background = #000000
foreground = #c5c8c6

border_col = #1a1a1a

modules_bg = #c5c8c6
modules_fg = #1a1a1a

modules_prefix_bg = #c5c8c6
modules_prefix_fg = #1a1a1a

urgent_bg  = #cc6666
focused_bg = #b5bd68

; Module-specific accent colors
wlan_bg     = #8abeb7
disk_bg     = #b294bb
vol_bg      = #f0c674
battery_bg  = #de935f
time_bg     = #b5bd68

background_trans = #000000

[bar/chocobar]

width  = 100%
height = 24
radius = 0

bottom = true

; Semi-transparent background
background = ${colors.background_trans}
foreground = ${colors.foreground}

line-size = 0

; Minimal borders with matching transparent color
border-size = 10
border-top-size = 10
border-left-size = 0
border-right-size = 30
border-color = ${colors.background_trans}

padding-left  = 0
padding-right = 0

module-margin-left  = 1
module-margin-right = 1

separator =
separator-foreground = ${colors.foreground}

; Readable fonts
font-0 = monospace:size=14;2
font-1 = Font Awesome 6 Free Solid:style=Solid:size=12;2
font-2 = Font Awesome 6 Brands Regular:style=Regular:size=12;2

modules-left = workspaces xwindow
modules-right = battery filesystem wlan pulseaudio date tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

override-redirect = false

; Uncomment for i3 integration
;wm-restack = i3

fixed-center = true

[module/workspaces]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = true

label-mode-background = #000000
label-mode-foreground = ${colors.foreground}
label-mode-padding = 1

; Show workspace numbers with boxes
label-focused = %name%
label-focused-background = #b5bd68
label-focused-foreground = #000000
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-background = #373b41
label-unfocused-foreground = #707880
label-unfocused-padding = 1

label-visible = %name%
label-visible-background = #373b41
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.urgent_bg}
label-urgent-foreground = #000000
label-urgent-padding = 1

pin-workspaces = true

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-background = #000000
label-foreground = ${colors.foreground}
label-padding = 1

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /

format-mounted = <label-mounted>
label-mounted = %percentage_used%%
label-mounted-background = ${colors.modules_bg}
label-mounted-foreground = ${colors.modules_fg}
label-mounted-padding = 1

format-mounted-prefix = "%{T2}%{T-}"
format-mounted-prefix-background = ${colors.disk_bg}
format-mounted-prefix-foreground = ${colors.modules_prefix_fg}
format-mounted-prefix-padding = 1

label-unmounted = N/A
label-unmounted-background = ${colors.modules_bg}
label-unmounted-foreground = ${colors.modules_fg}
label-unmounted-padding = 1

[module/pulseaudio]
type = internal/pulseaudio

; Volume level icons (low/medium/high)
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

format-volume = %{T2}<ramp-volume>%{T-} <label-volume>
label-volume = %percentage%%
label-volume-background = ${colors.modules_bg}
label-volume-foreground = ${colors.modules_fg}
label-volume-padding = 1

format-volume-background = ${colors.vol_bg}
format-volume-foreground = #1a1a1a
format-volume-padding = 1

; Mute icon
label-muted = %{T2}%{T-} MUTE
label-muted-background = ${colors.modules_bg}
label-muted-foreground = #707880
label-muted-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
full-at = 99
low-at = 10
poll-interval = 5

; Define multiple battery icons (0-4, empty to full)
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

format-charging = %{T2}<ramp-capacity>%{T-} <label-charging>
format-charging-background = ${colors.battery_bg}
format-charging-padding = 1

label-charging = %percentage%%
label-charging-background = ${colors.modules_bg}
label-charging-foreground = ${colors.modules_fg}
label-charging-padding = 1

format-discharging = %{T2}<ramp-capacity>%{T-} <label-discharging>
format-discharging-background = ${colors.battery_bg}
format-discharging-padding = 1

label-discharging = %percentage%%
label-discharging-background = ${colors.modules_bg}
label-discharging-foreground = ${colors.modules_fg}
label-discharging-padding = 1

format-full = %{T2}<ramp-capacity>%{T-} <label-full>
format-full-background = ${colors.battery_bg}
format-full-padding = 1

label-full = %percentage%%
label-full-background = ${colors.modules_bg}
label-full-foreground = ${colors.modules_fg}
label-full-padding = 1
[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <label-connected>
label-connected = %essid%
label-connected-background = ${colors.modules_bg}
label-connected-foreground = ${colors.modules_fg}
label-connected-padding = 1

format-connected-prefix = "%{T2}%{T-}"
format-connected-prefix-background = ${colors.wlan_bg}
format-connected-prefix-foreground = #1a1a1a
format-connected-prefix-padding = 1

format-disconnected = <label-disconnected>
label-disconnected = DOWN
label-disconnected-background = ${colors.modules_bg}
label-disconnected-foreground = #707880
label-disconnected-padding = 1

format-disconnected-prefix = "%{T2}%{T-}"
format-disconnected-prefix-background = ${colors.wlan_bg}
format-disconnected-prefix-foreground = ${colors.modules_prefix_fg}
format-disconnected-prefix-padding = 1

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M
date-alt = %H:%M:%S

format = <label>
label = %date%
label-background = ${colors.modules_bg}
label-foreground = ${colors.modules_fg}
label-padding = 1

format-prefix = "%{T2} %{T-}"
format-prefix-background = ${colors.time_bg}
format-prefix-foreground = ${colors.modules_prefix_fg}
format-prefix-padding = 1

[module/paddinglite]
type = custom/text
content = |
content-padding = 0.5
content-foreground = ${colors.background_trans}
content-background = ${colors.background_trans}

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-padding = 2
tray-background = ${colors.background_trans}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
